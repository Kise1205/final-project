<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Calorie Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">🍽️ Calorie Tracker</a>
            <div>
                <span class="text-light me-3" id="userEmail"></span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Total Calories Card -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card bg-primary text-white p-4 text-center shadow">
                    <h5 class="mb-1">🔥 Total Calories Today</h5>
                    <h1 id="totalCals" class="display-4 fw-bold mb-0">0</h1>
                    <small class="opacity-75">kcal</small>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Add Meal Form -->
            <div class="col-md-4 mb-4">
                <div class="card p-4 shadow-sm border-0">
                    <h4 class="mb-3 fw-bold">➕ Add New Meal</h4>
                    <form id="foodForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Food Name</label>
                            <input type="text" id="foodName" class="form-control" placeholder="e.g. Apple, Chicken Rice..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Calories</label>
                            <input type="number" id="calories" class="form-control" placeholder="e.g. 150" required min="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Category</label>
                            <select id="category" class="form-select" required>
                                <option value="" disabled selected>Select Category</option>
                                <option value="Breakfast">🍳 Breakfast</option>
                                <option value="Lunch">🥗 Lunch</option>
                                <option value="Dinner">🍽️ Dinner</option>
                                <option value="Snack">🍪 Snack</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Save Entry</button>
                    </form>
                </div>
            </div>

            <!-- Food List -->
            <div class="col-md-8">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0 fw-bold">📋 Your Food Log</h4>
                    <input type="text" id="searchInput" class="form-control w-50" placeholder="🔍 Search by name...">
                </div>
                
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Food</th>
                                <th>Calories</th>
                                <th>Category</th>
                                <th>Date</th>
                                <th style="width: 120px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="foodTableBody">
                            <!-- JS render -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">✏️ Edit Meal</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">Food Name</label>
                            <input type="text" id="editName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Calories</label>
                            <input type="number" id="editCalories" class="form-control" required min="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select id="editCategory" class="form-select" required>
                                <option value="Breakfast">🍳 Breakfast</option>
                                <option value="Lunch">🥗 Lunch</option>
                                <option value="Dinner">🍽️ Dinner</option>
                                <option value="Snack">🍪 Snack</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./scripts/calorie-crud.js?v=3"></script>
</body>
</html>
