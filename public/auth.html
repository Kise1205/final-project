<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
        
        <div class="d-flex justify-content-center mb-4 btn-group" role="group">
            <button type="button" id="showLoginBtn" class="btn btn-primary">Login</button>
            <button type="button" id="showRegisterBtn" class="btn btn-outline-primary">Register</button>
        </div>

        <div id="loginSection">
            <h3 class="text-center mb-3">Welcome Back</h3>
            <form id="loginForm">
                <div class="mb-3">
                    <label>Email address</label>
                    <input type="email" id="loginEmail" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" id="loginPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>

        <div id="registerSection" style="display: none;">
            <h3 class="text-center mb-3">Create Account</h3>
            <form id="registerForm">
                <div class="mb-3">
                    <label>Email address</label>
                    <input type="email" id="regEmail" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" id="regPassword" class="form-control" required minlength="6">
                </div>
                <div class="mb-3">
                    <label>Account Role</label>
                    <select id="regRole" class="form-select">
                        <option value="user">Standard User</option>
                        <option value="admin">System Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100">Register & Auto-Login</button>
            </form>
        </div>

        <div id="messageBox" class="text-center mt-3 fw-bold"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./scripts/auth.js"></script>
</body>
</html>
